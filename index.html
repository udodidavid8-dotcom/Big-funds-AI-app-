<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Funds + Math AI</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0}
.header{background:#111;padding:15px;text-align:center;font-size:20px;font-weight:bold;color:#00ff88}
#chat{height:78vh;overflow-y:auto;padding:15px;padding-bottom:80px}
.msg{padding:12px 15px;margin:8px;border-radius:15px;max-width:85%;line-height:1.5;white-space:pre-wrap}
.user{background:#00ff88;color:black;margin-left:auto}
.ai{background:#222}
#box{display:flex;padding:10px;background:#111;position:fixed;bottom:0;width:100%;box-sizing:border-box;gap:6px}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
button{padding:12px 14px;border-radius:20px;border:none;font-weight:bold;cursor:pointer}
.send{background:#00ff88}
.mathbtn{background:#444;color:white}
</style>
</head>
<body>
<div class="header">Big Funds + Math AI</div>
<div id="chat"><div class="msg ai">Hello! I can:
1. Help you with big funds/business in English
2. Solve any MATH problem step-by-step.

Try: "Solve 2x + 5 = 15" or "How to get funding?"</div></div>
<div id="box">
<button class="mathbtn" onclick="insertMath()">x²</button>
<input id="q" placeholder="Ask math or funds...">
<button class="send" onclick="ask()">Send</button>
</div>
<script>
function insertMath(){ document.getElementById('q').value += " Solve: "; document.getElementById('q').focus(); }

async function ask(){
 let input=document.getElementById('q');
 let text=input.value.trim(); if(!text) return;
 let chat=document.getElementById('chat');
 chat.innerHTML+=`<div class="msg user">${text}</div>`;
 input.value='';
 chat.scrollTop=chat.scrollHeight;
 
 let prompt = `You are Big Funds + Math AI. Answer in clear English.
 If user asks math, solve step-by-step, explain simply, give final answer in box. Use LaTeX for math like $x=5$.
 If user asks about funds/business, give practical funding advice.
 User question: ${text}`;

 chat.innerHTML+=`<div class="msg ai" id="temp">Thinking...</div>`;
 try{
   const r=await puter.ai.chat(prompt);
   document.getElementById('temp').remove();
   chat.innerHTML+=`<div class="msg ai">${r.message.content}</div>`;
   if(window.MathJax) MathJax.typesetPromise();
 } catch(e){
   document.getElementById('temp').innerHTML = "Error, try again. " + e;
 }
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('q').addEventListener('keypress',e=>{if(e.key==='Enter')ask()})
</script>
</body>
</html>
