<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Funds AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0}
.header{background:#111;padding:15px;text-align:center;font-size:22px;font-weight:bold;color:#00ff88}
#chat{height:80vh;overflow-y:auto;padding:15px}
.msg{padding:10px 15px;margin:8px;border-radius:15px;max-width:80%}
.user{background:#00ff88;color:black;margin-left:auto}
.ai{background:#222}
#box{display:flex;padding:10px;background:#111;position:fixed;bottom:0;width:100%;box-sizing:border-box}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
button{padding:12px 20px;margin-left:8px;border-radius:20px;border:none;background:#00ff88;font-weight:bold}
</style>
</head>
<body>
<div class="header">Big Funds AI - Ask in English</div>
<div id="chat"><div class="msg ai">Hello! I am Big Funds AI. Ask me anything about money, business, or investment in English.</div></div>
<div id="box"><input id="q" placeholder="Ask in English..."><button onclick="ask()">Send</button></div>
<script>
async function ask(){
 let input=document.getElementById('q');
 let text=input.value; if(!text) return;
 let chat=document.getElementById('chat');
 chat.innerHTML+=`<div class="msg user">${text}</div>`;
 input.value='';
 chat.scrollTop=chat.scrollHeight;
 const r=await puter.ai.chat(`Answer in clear English for someone seeking big funds: ${text}`);
 chat.innerHTML+=`<div class="msg ai">${r.message.content}</div>`;
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('q').addEventListener('keypress',e=>{if(e.key==='Enter')ask()})
</script>
</body>
</html>
